# /etc/nginx/sites-available/jaetech247.pro
# Nginx reverse proxy: HTTPS 443 → FastAPI :8080

# upstream 정의 — 재시작 중 연결 실패 시 retry 방지
upstream fastapi_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name jaetech247.pro www.jaetech247.pro;
    # Redirect HTTP → HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name jaetech247.pro www.jaetech247.pro;

    # SSL — managed by Certbot
    ssl_certificate     /etc/letsencrypt/live/jaetech247.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jaetech247.pro/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy no-referrer-when-downgrade;

    # Upload size limit (screenshots)
    client_max_body_size 15M;

    # Static files served directly by Nginx (bypass FastAPI)
    location /static/ {
        alias /home/ubuntu/jaetech247/app/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /uploads/ {
        alias /home/ubuntu/jaetech247/uploads/;
        expires 7d;
        # Restrict to image types only
        location ~* \.(jpg|jpeg|png|webp)$ { }
        return 403;
    }

    # WebSocket upgrade support (모든 WS 경로 — /channel/, /stock/, /premium/)
    location ~ ^/(channel|stock|premium)/ {
        proxy_pass         http://fastapi_backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;   # keep WS alive 1h
    }

    # Main FastAPI app
    location / {
        proxy_pass             http://fastapi_backend;
        proxy_http_version     1.1;
        proxy_set_header       Host $host;
        proxy_set_header       X-Real-IP $remote_addr;
        proxy_set_header       X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;
        proxy_read_timeout     60s;
        proxy_connect_timeout  10s;
        proxy_send_timeout     60s;
        # 재시작 중 502/504 시 에러 페이지 대신 재시도
        proxy_next_upstream    error timeout http_502 http_504;
        proxy_next_upstream_tries 2;
    }
}
